<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · Grovio</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
</head>
<body>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-brand">
                <span class="brand-mark">G</span>
                <span style="font-weight:650; letter-spacing:-0.02em; font-size:1.05rem;">Grovio</span>
            </div>

            <h1>Welcome back</h1>
            <p class="auth-sub">Sign in to your restaurant operations console.</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="password">Dashboard password</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••••" required autofocus autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign in</button>
            </form>

            <p class="auth-foot">Protected workspace · Authorized personnel only</p>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script>
        const loginForm = document.getElementById('login-form');

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span> <div>${message}</div>`;
            container.appendChild(toast);

            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);

            // Auto remove
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;

            const formData = new FormData();
            formData.append('password', password);

            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (response.ok && data.success) {
                    showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 1000);
                } else {
                    showToast(data.message || 'Login failed. Please try again.', 'error');
                }
            } catch (err) {
                showToast('A network error occurred. Please check server logs.', 'error');
            }
        });
    </script>
</body>
</html>
